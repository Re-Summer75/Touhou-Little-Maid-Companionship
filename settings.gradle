pluginManagement {
    includeBuild('build-logic')
    repositories {
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            url = 'https://maven.parchmentmc.org'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}

// ASCII Gradle identifier for “Touhou Little Maid: Companionship”.
rootProject.name = 'TLM-Companionship-1.20.1'

include(
        'kernel',
        'shared:geometry',
        'features:level',
        'features:status',
        'features:advancement',
        'features:interaction',
        'features:physics',
        'features:shading',
        'features:atmosphere',
        'adapters:forge-1.20.1',
        'adapters:tlm-1.20.1-gecko3',
        'distribution:forge-1.20.1'
)
