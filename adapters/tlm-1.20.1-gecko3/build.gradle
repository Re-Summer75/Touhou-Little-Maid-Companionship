plugins {
    id 'base'
}

description = 'Touhou Little Maid 1.20.1 and GeckoLib 3 model adapters.'

tasks.register('verifyAdapterLayout') {
    group = 'verification'
    inputs.files(fileTree('src/main/java') { include '**/*.java' })
    doLast {
        def sources = inputs.files.files
        if (sources.size() < 50) {
            throw new GradleException(
                    "TLM adapter must contain real integration sources; found ${sources.size()}."
            )
        }

        def sourceRoot = file('src/main/java')
        sources.each { source ->
            def relative = sourceRoot.toPath()
                    .relativize(source.toPath())
                    .toString()
                    .replace('\\', '/')
            def text = source.getText('UTF-8')
            if (relative.contains('/platform/network/')
                    || relative.contains('/client/network/')
                    || relative.contains('/platform/gui/')
                    || relative.contains('/platform/menu/')
                    || relative.matches('.*feature/[^/]+/network/.*')
                    || relative.matches('.*feature/[^/]+/forge/.*')
                    || text.contains(
                    'net.minecraftforge.event.RegisterCommandsEvent'
            )
                    || text.contains(
                    'net.minecraftforge.network.NetworkHooks'
            )
                    || text.contains(
                    'net.minecraftforge.registries.DeferredRegister'
            )
                    || text.contains(
                    'net.minecraftforge.common.extensions.IForgeMenuType'
            )) {
                throw new GradleException(
                        "Forge network/GUI/installer infrastructure leaked into TLM adapter: ${relative}"
                )
            }
            if (text.contains('implements ForgeFeatureInstaller')
                    || text.contains(
                    'import com.laixia.maidintelligence.platform.forge.ForgeFeatureInstaller'
            )) {
                throw new GradleException(
                        "TLM adapter implements a Forge installer: ${relative}"
                )
            }
            if (text.contains(
                    'import com.laixia.maidintelligence.MaidIntelligence'
            )) {
                throw new GradleException(
                        "TLM adapter depends on distribution composition root: ${relative}"
                )
            }
        }

        def required = [
                'feature/advancement/bridge/MaidWorldAdvancementTriggers.java',
                'feature/advancement/bridge/MaidCombatAdvancementTriggers.java',
                'feature/advancement/bridge/MaidProgressAdvancementTriggers.java',
                'feature/advancement/server/MaidVanillaWorldCriteria.java',
                'feature/advancement/server/MaidVanillaCombatCriteria.java',
                'feature/advancement/server/MaidProgressCriteria.java',
                'feature/advancement/tlm/TlmAdvancementRequestResolver.java'
        ]
        required.each { relative ->
            if (!file(
                    "src/main/java/com/laixia/maidintelligence/${relative}"
            ).isFile()) {
                throw new GradleException(
                        "Missing TLM adapter boundary source: ${relative}"
                )
            }
        }
        [
                'feature/advancement/api/MaidAdvancementTriggers.java',
                'feature/advancement/bridge/MaidAdvancementTriggers.java',
                'feature/advancement/server/MaidCriteria.java'
        ].each { relative ->
            if (file(
                    "src/main/java/com/laixia/maidintelligence/${relative}"
            ).exists()) {
                throw new GradleException(
                        "Legacy advancement trigger hub remains: ${relative}"
                )
            }
        }

        // Every Mixin into the host is a method descriptor that a future host
        // release can invalidate, so the count is pinned: adding one has to be
        // a decision somebody made on purpose, not a drift.
        //
        // 14, down from 27, and that halving is the point of the whole change.
        //
        // Fifteen went out. Most coordinated the host's own behaviours against
        // ours, which free mode no longer needs because it registers none of
        // them; the rest were host-mode enhancements (adaptive activity radius,
        // combat pre-warming, pickup sensor replacement) removed wholesale,
        // because this mod cannot promise to stay compatible with every work
        // mode, addon and companion mod that touches them.
        //
        // Two came in, and they replace what would otherwise have been a dozen:
        // MaidBrainFreedomIsolationMixin swaps the whole brain registration for
        // free mode in one place instead of intercepting each host behaviour's
        // start conditions, and ExtraMaidBrainAccessor reaches the extension
        // list that rebuild has to preserve.
        //
        // 16 现在，而这个数字之前是错的：清单写 14，仓库里实际有 15 个
        // ——某次新增没有同步这里，于是这道闸在干净的 HEAD 上就是红的，
        // 而"红"不再传递任何信息。修正时把两笔分开记，免得一次改动把
        // 另一笔悄悄吞掉：
        //   +1 已存在的漂移（清单 14 → 实际 15，来源未知，先如实登记）
        //   +1 ai.MaidMoveControlGuardFacingMixin（本次，见下）
        //
        // 新增的那一个买到的是"举盾后退时倒着走"。原版只挡正面来的伤害，
        // 而宿主的 MaidMoveControl 每 tick 把身体扭向行进方向、且跑在 brain
        // 之后——没有第二个地方能压过它。玩家能转身格挡，这一处注入让她也能。
        def mixins = fileTree(
                'src/main/java/com/laixia/maidintelligence/mixin/tlm'
        ) {
            include '**/*.java'
        }.files
        if (mixins.size() != 16) {
            throw new GradleException(
                    "Expected 16 TLM/Gecko Mixins, found ${mixins.size()}."
            )
        }
        mixins.each { mixin ->
            if (!mixin.getText('UTF-8').contains('remap = false')) {
                throw new GradleException(
                        "TLM/Gecko Mixin must use remap=false: ${mixin}"
                )
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyAdapterLayout')
}
