plugins {
    id 'base'
    id 'idea'
}

group = mod_group_id
version = mod_version

def distributionPath = ':distribution:forge-1.20.1'
def stableModules = [
        ':kernel',
        ':shared:geometry',
        ':features:level',
        ':features:status',
        ':features:advancement',
        ':features:interaction',
        ':features:physics',
        ':features:shading',
        ':features:atmosphere'
]

allprojects {
    group = rootProject.group
    version = rootProject.version
}

tasks.named('check') {
    dependsOn stableModules.collect { "${it}:check" }
    dependsOn "${distributionPath}:check"
}

tasks.named('assemble') {
    dependsOn "${distributionPath}:reobfJar"
}

tasks.register('verifyArchitecture') {
    group = 'verification'
    description = 'Runs dependency-boundary checks for every stable module.'
    dependsOn stableModules.collect { "${it}:verifyArchitecture" }
}

tasks.register('verifyAll') {
    group = 'verification'
    description = 'Runs every registered functional verification suite.'
    dependsOn "${distributionPath}:verifyAll"
}

[
        'verifyLevelDomain',
        'verifyStatusDomain',
        'verifyAdvancementDomain',
        'verifyFaceTracking',
        'verifyBonePhysics',
        'verifyModelShading',
        'auditMeshColliders',
        'auditMeshPenetration',
        'benchmarkBonePhysics',
        'prepareVSCodeRunClient',
        'runClient',
        'runServer',
        'runGameTestServer',
        'runData'
].each { delegatedTask ->
    tasks.register(delegatedTask) {
        group = delegatedTask.startsWith('run') ? 'forgegradle runs' : 'verification'
        dependsOn "${distributionPath}:${delegatedTask}"
    }
}

idea {
    project {
        jdkName = '17'
        languageLevel = '17'
    }
}
