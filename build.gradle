plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

group = mod_group_id
version = mod_version
archivesBaseName = "${mod_id}-${minecraft_version}-forge"

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    copyIdeResources = true
    runs {
        configureEach {
            jvmArgs = [
                    "-XX:+IgnoreUnrecognizedVMOptions",
                    "-XX:+AllowEnhancedClassRedefinition"
            ]
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', "${mod_id},minecraft"
        }
        data {
            workingDirectory project.file('run')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // 目前只有 CurseForge Maven 能够支持同时下载模组和源码，方便开发
    // Current Only CurseForge Maven can support downloading both mod and source code, which is convenient for development
    implementation fg.deobf('curse.maven:touhou-little-maid-355044:8061847-sources-8061848')
}

processResources {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_license            : mod_license,
            mod_version            : mod_version
    ]
    inputs.properties replaceProperties
    doLast {
        def metadataFile = new File(destinationDir, 'META-INF/mods.toml')
        def metadata = metadataFile.getText('UTF-8')
        replaceProperties.each { key, value ->
            metadata = metadata.replace('${' + key + '}', value.toString())
        }
        metadataFile.setText(metadata, 'UTF-8')
    }
}

jar {
    manifest {
        attributes([
                "Implementation-Title"  : project.name,
                "Implementation-Version": "${version}"
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('prepareVSCodeRunClient') {
    group = 'ide'
    description = 'Regenerates VS Code run metadata and compiles before F5.'
    dependsOn 'genVSCodeRuns', 'prepareRunClientCompile', 'prepareVSCodeTlmMod'
}

tasks.register('prepareVSCodeTlmMod', Sync) {
    group = 'ide'
    description = 'Stages Touhou Little Maid as an exploded mod for VS Code F5.'
    from {
        def tlmRuntimeJar = configurations.runtimeClasspath.files.find {
            it.name.toLowerCase().contains('touhou-little-maid')
        }
        if (tlmRuntimeJar == null) {
            throw new GradleException('Touhou Little Maid runtime dependency was not resolved.')
        }
        zipTree(tlmRuntimeJar)
    }
    into layout.buildDirectory.dir('vscodeMods/touhou_little_maid')
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
}

tasks.matching { it.name == 'genVSCodeRuns' }.configureEach {
    doLast {
        def tasksFile = file('.vscode/tasks.json')
        if (tasksFile.exists()) {
            def tasksJson = new groovy.json.JsonSlurper().parse(tasksFile)
            tasksJson.tasks.findAll { it.label == 'prepareRunClientCompile' }.each {
                it.command = '${workspaceFolder}\\gradlew.bat --offline prepareVSCodeRunClient'
            }
            tasksFile.setText(
                    groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(tasksJson)),
                    'UTF-8'
            )
        }

        def launchFile = file('.vscode/launch.json')
        if (launchFile.exists()) {
            def launchJson = new groovy.json.JsonSlurper().parse(launchFile)
            launchJson.configurations.each {
                it.projectName = rootDir.name
            }
            launchJson.configurations.findAll { it.name == 'runClient' }.each {
                def tlmModClasses = 'touhou_little_maid%%${workspaceFolder}\\build\\vscodeMods\\touhou_little_maid'
                if (!it.env.MOD_CLASSES.split(';').contains(tlmModClasses)) {
                    it.env.MOD_CLASSES += ';' + tlmModClasses
                }
                it.remove('classPaths')
                it.shortenCommandLine = 'argfile'
            }
            launchFile.setText(
                    groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(launchJson)),
                    'UTF-8'
            )
        }
    }
}

tasks.register('verifyLevelDomain', JavaExec) {
    group = 'verification'
    description = 'Runs dependency-free verification for the level domain and codec.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.laixia.maidintelligence.feature.level.LevelDomainVerification'
}

tasks.register('verifyStatusDomain', JavaExec) {
    group = 'verification'
    description = 'Runs verification for hunger and tool durability status policies.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.laixia.maidintelligence.feature.status.StatusDomainVerification'
}

tasks.register('prepareGameTestStructures', Copy) {
    from 'src/test/resources/gameteststructures'
    into 'run/gameteststructures'
}

tasks.configureEach {
    if (name == 'runGameTestServer') {
        dependsOn prepareGameTestStructures
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
