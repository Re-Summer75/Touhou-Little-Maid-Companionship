buildscript {
    repositories {
        maven {
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    alias(libs.plugins.forgegradle)
    alias(libs.plugins.parchment)
}

apply plugin: 'org.spongepowered.mixin'

description = "Forge ${forge_version} / Minecraft ${minecraft_version} " +
        'distribution and the only ForgeGradle compilation boundary.'
archivesBaseName = "tlm-companionship-${minecraft_version}-forge"

def stableModules = [
        project(':kernel'),
        project(':shared:geometry'),
        project(':features:level'),
        project(':features:status'),
        project(':features:ai'),
        project(':features:ai:behavior'),
        project(':features:ai:orchestration'),
        project(':features:advancement'),
        project(':features:interaction'),
        project(':features:physics'),
        project(':features:shading'),
        project(':features:atmosphere')
]
def forgeAdapter = project(forge_adapter_project_path)
def tlmAdapter = project(tlm_adapter_project_path)
def gameTestRunDir = rootProject.file('run-gametest')
def tlmMixinConfig =
        "tlm_companionship.tlm-gecko${gecko_generation}.mixins.json"

// ForgeGradle consumes stable-module source sets while this project is configured.
stableModules.each { module ->
    evaluationDependsOn(module.path)
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
}

sourceSets {
    main {
        java {
            srcDir forgeAdapter.file('src/main/java')
            srcDir tlmAdapter.file('src/main/java')
        }
        resources {
            srcDir 'src/generated/resources'
        }
    }
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            jvmArgs = [
                    '-XX:+IgnoreUnrecognizedVMOptions',
                    '-XX:+AllowEnhancedClassRedefinition'
            ]
            workingDirectory rootProject.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile',
                    "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                    stableModules.each { module ->
                        source module.sourceSets.main
                    }
                }
            }
        }
        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
        gameTestServer {
            workingDirectory gameTestRunDir
            property 'forge.enabledGameTestNamespaces', "${mod_id},minecraft"
        }
        data {
            args '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    // MixinGradle emits one refmap per source set. MC/Forge configs share it;
    // every TLM/Gecko target uses remap=false and intentionally has no refmap.
    add sourceSets.main, 'tlm_companionship.refmap.json'
    config 'tlm_companionship.common.mixins.json'
    config 'tlm_companionship.client.mixins.json'
    config tlmMixinConfig
}

repositories {
    maven {
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf(
            'curse.maven:touhou-little-maid-355044:8061847-sources-8061848'
    )
    if ((findProperty('compatTestMods') ?: 'false').toBoolean()) {
        // Optional runtime fixture set for reproducing third-party compatibility issues.
        runtimeOnly fg.deobf('curse.maven:xfoxsword-1346395:8525435')
        runtimeOnly fg.deobf('curse.maven:celestial-artifacts-988784:8380475')
        runtimeOnly fg.deobf('curse.maven:celestial-core-988783:8512427')
        runtimeOnly fg.deobf('curse.maven:curios-309927:6418456')
    }
    stableModules.each { module ->
        implementation project(module.path)
    }
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

processResources {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            tlm_version_range      : tlm_version_range,
            mod_id                 : mod_id,
            mod_license            : mod_license,
            mod_version            : mod_version
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/mods.toml') {
        expand replaceProperties
    }
}

jar {
    stableModules.each { module ->
        dependsOn module.tasks.named('classes')
        from module.sourceSets.main.output
    }
    duplicatesStrategy = DuplicatesStrategy.FAIL
    manifest {
        attributes([
                'Implementation-Title'  : mod_name_en,
                'Implementation-Version': "${version}"
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.matching {
    it.name.startsWith('prepareRun') && it.name.endsWith('Compile')
}.configureEach {
    dependsOn stableModules.collect { it.tasks.named('classes') }
}

apply from: rootProject.file('gradle/verification-reachability.gradle')

// Lower bound only: splitting or adding verifications must never fail the build,
// but silently dropping them must. Raise the floor when the suite grows durably.
def minimumVerificationSources = 115

tasks.register('verifyTestInventory') {
    group = 'verification'
    description = 'Guards against silent removal of verification sources.'
    inputs.files(fileTree('src/test/java') { include '**/*.java' })
    doLast {
        def actual = inputs.files.files.size()
        if (actual < minimumVerificationSources) {
            throw new GradleException(
                    "Verification inventory shrank: expected at least "
                            + "${minimumVerificationSources} Java files, found ${actual}."
            )
        }
    }
}

tasks.register('verifyAll') {
    group = 'verification'
    description = 'Runs all automatically discovered verification entrypoints.'
    dependsOn verificationTaskNames
    dependsOn tasks.named('verifyTestInventory')
    dependsOn tasks.named('verifyVerificationReachability')
    dependsOn stableModules.collect { "${it.path}:verifyArchitecture" }
}

tasks.register('verifyDistributionBoundary') {
    group = 'verification'
    inputs.files(fileTree('src/main/java') { include '**/*.java' })
    doLast {
        def productionSources = inputs.files.files
        if (productionSources.size() != 1
                || productionSources.first().name != 'MaidIntelligence.java') {
            throw new GradleException(
                    'Distribution production code must contain only the @Mod composition root.'
            )
        }
    }
}

tasks.register('verifyMixinLayout') {
    group = 'verification'
    def configs = [
            'tlm_companionship.common.mixins.json'     : [
                    'HoneyBlockSlideMixin',
                    'PlayerListAccessor',
                    'ServerPlayerAccessor'
            ],
            'tlm_companionship.client.mixins.json'     : [
                    'LivingEntityEatingParticleMixin',
                    'LivingEntityRendererAccessor'
            ],
            (tlmMixinConfig)                              : [
                    'EntityMaidAiOptimizationMixin',
                    'EntityMaidPlaceBlockMixin',
                    'MaidFeedAnimalTaskMixin',
                    'MaidPickupEntitiesSensorOptimizationMixin',
                    'ai.EntitySitCommandSeatLockMixin',
                    'ai.EntityMaidMovementCoordinationMixin',
                    'ai.MaidBegMovementCoordinationMixin',
                    'ai.MaidBreathAirMovementCoordinationMixin',
                    'ai.MaidFollowOwnerMovementCoordinationMixin',
                    'ai.MaidFollowOwnerVehicleSeatLockMixin',
                    'ai.MaidMoveToBlockMovementCoordinationMixin',
                    'ai.MaidPickupMovementCoordinationMixin',
                    'ai.MaidScheduleCommandSeatLockMixin',
                    'ai.SchedulePosMovementCoordinationMixin',
                    'ai.arbitration.BlockJoyOwnerCommandSuppressionMixin',
                    'ai.arbitration.MaidBoardGameTaskMovementCoordinationMixin',
                    'ai.arbitration.MaidJoyTaskMovementCoordinationMixin',
                    'ai.arbitration.MaidRunOneMovementCoordinationMixin',
                    'status.MaidPickupInventoryFeedbackMixin',
                    'CustomPackPhysicsMetadataMixin',
                    'EntityMaidClientRandomHealingMixin',
                    'EntityMaidRendererYsmCaptureMixin',
                    'GeckoMaidEntityBonePhysicsMixin',
                    'GeoRendererOutsideNormalMixin',
                    'SodiumDownNormalPackingMixin',
                    'SodiumOutsideNormalFallbackMixin'
            ]
    ]
    inputs.files(configs.keySet().collect { file("src/main/resources/${it}") })
    inputs.file('src/main/resources/META-INF/mods.toml')
    doLast {
        configs.each { name, expectedMixins ->
            def configFile = file("src/main/resources/${name}")
            if (!configFile.isFile()) {
                throw new GradleException("Missing Mixin config ${name}")
            }
            def config = configFile.getText('UTF-8')
            expectedMixins.each { mixinName ->
                if (!config.contains("\"${mixinName}\"")) {
                    throw new GradleException(
                            "${name} does not register ${mixinName}."
                    )
                }
            }
            int count = (config =~ /"(?:[a-z][A-Za-z0-9_]*\.)*[A-Z][A-Za-z0-9]*(?:Mixin|Accessor)"/)
                    .count
            if (count != expectedMixins.size()) {
                throw new GradleException(
                        "${name} expected ${expectedMixins.size()} Mixins, found ${count}."
                )
            }
            if (name == tlmMixinConfig) {
                if (config.contains('"refmap"')) {
                    throw new GradleException(
                            'TLM/Gecko Mixin config must not declare a refmap.'
                    )
                }
            } else if (!config.contains(
                    '"refmap": "tlm_companionship.refmap.json"'
            )) {
                throw new GradleException(
                        "${name} must use the generated common refmap."
                )
            }
        }
        def modsToml = file(
                'src/main/resources/META-INF/mods.toml'
        ).getText('UTF-8')
        configs.keySet().each { name ->
            if (!modsToml.contains(name)) {
                throw new GradleException(
                        "mods.toml does not register ${name}."
                )
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyAll')
    dependsOn tasks.named('verifyDistributionBoundary')
    dependsOn tasks.named('verifyMixinLayout')
    dependsOn forgeAdapter.tasks.named('verifyAdapterLayout')
    dependsOn tlmAdapter.tasks.named('verifyAdapterLayout')
}

tasks.register('auditMeshColliders', JavaExec) {
    group = 'verification'
    description = 'Reports mesh collider counts per shipped model.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.laixia.maidintelligence.feature.physics.client.MeshColliderAudit'
    workingDir rootProject.projectDir
}

tasks.register('auditMeshPenetration', JavaExec) {
    group = 'verification'
    description = 'Reports axis and surface penetration depth per model.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.laixia.maidintelligence.feature.physics.client.MeshPenetrationAudit'
    workingDir rootProject.projectDir
    if (project.hasProperty('auditArgs')) {
        args project.property('auditArgs').toString().split(' ')
    }
}

tasks.register('benchmarkBonePhysics', JavaExec) {
    group = 'verification'
    description = 'Reports warmed spring-bone timing and allocation.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.laixia.maidintelligence.feature.physics.client.BonePhysicsBenchmark'
    workingDir rootProject.projectDir
}

def cleanGameTestWorld = tasks.register('cleanGameTestWorld', Delete) {
    delete new File(gameTestRunDir, 'world')
}

def prepareGameTestStructures = tasks.register(
        'prepareGameTestStructures',
        Copy
) {
    from 'src/test/resources/gameteststructures'
    into new File(gameTestRunDir, 'gameteststructures')
}

tasks.configureEach {
    if (name == 'runGameTestServer') {
        dependsOn cleanGameTestWorld, prepareGameTestStructures
    }
}

ext.forgeIdeAssembly = [
        stableModules: stableModules,
        sourceSets   : sourceSets,
        projectDir  : projectDir
]
apply from: rootProject.file('gradle/distribution/forge-ide-assembly.gradle')
