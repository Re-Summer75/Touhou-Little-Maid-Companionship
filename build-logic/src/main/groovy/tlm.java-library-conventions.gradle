plugins {
    id 'java-library'
}

group = providers.gradleProperty('mod_group_id').get()
version = providers.gradleProperty('mod_version').get()

repositories {
    mavenCentral()
}

def targetJavaVersion = project.property('java_version')
        .toString()
        .toInteger()

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = targetJavaVersion
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

def forbiddenCoreImports = [
        'net.minecraft.',
        'net.minecraftforge.',
        'com.github.tartaricacid.',
        'software.bernie.geckolib'
]
// Constant-pool form of the same prefixes. Scanning bytecode catches what the
// source pass cannot: fully qualified references used without an import.
def forbiddenBinaryNames = forbiddenCoreImports.collect {
    it.replace('.', '/')
}

def mainClassesDir = tasks.named('compileJava')
        .flatMap { it.destinationDirectory }

def javaSources = fileTree('src/main/java') { include '**/*.java' }

tasks.register('verifyArchitecture') {
    group = 'verification'
    description = 'Rejects game-loader and model-library references in stable modules.'
    dependsOn tasks.named('classes')
    inputs.files(javaSources)
    // files() rather than dir(): a resource-only stable module never produces a
    // classes directory, and dir() still demands the path exist even when
    // declared optional.
    inputs.files(mainClassesDir).optional()

    doLast {
        def violations = []
        javaSources.files.sort().each { source ->
            source.readLines('UTF-8').eachWithIndex { line, index ->
                if (line.stripLeading().startsWith('import ')
                        && forbiddenCoreImports.any { line.contains(it) }) {
                    violations << "${source}:${index + 1}: ${line.trim()}"
                }
            }
        }

        def classesDir = mainClassesDir.get().asFile
        if (classesDir.isDirectory()) {
            def compiledClasses = []
            classesDir.eachFileRecurse { candidate ->
                if (candidate.isFile() && candidate.name.endsWith('.class')) {
                    compiledClasses << candidate
                }
            }
            compiledClasses.sort().each { compiled ->
                // ISO-8859-1 maps every byte to one char, so the constant pool can
                // be searched as text without decoding the class structure.
                def constantPool = new String(compiled.bytes, 'ISO-8859-1')
                forbiddenBinaryNames.findAll { constantPool.contains(it) }.each { found ->
                    violations << "${compiled}: references ${found.replace('/', '.')}"
                }
            }
        }

        if (!violations.isEmpty()) {
            throw new GradleException(
                    "Stable module ${project.path} depends on version APIs:\n"
                            + violations.join('\n')
            )
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyArchitecture')
}
