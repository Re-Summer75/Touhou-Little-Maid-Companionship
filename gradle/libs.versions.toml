[versions]
mixin = "0.8.5"
joml = "1.10.5"
junit = "5.10.2"
# Compile-only API floors for stable modules. The game supplies the runtime
# copies, so these only need to be old enough to stay source-compatible.
gson = "2.10"
slf4j = "2.0.1"

[libraries]
joml = { module = "org.joml:joml", version.ref = "joml" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }

[plugins]
forgegradle = { id = "net.minecraftforge.gradle", version = "6.0.54" }
parchment = { id = "org.parchmentmc.librarian.forgegradle", version = "1.2.0" }
